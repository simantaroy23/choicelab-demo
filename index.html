<style>
/* Layout: researcher setup -> profile (picks store channel + language) -> store trips (3D or 2D walk-in, or online shop) -> debrief -> researcher results */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #e9edef;
  --img-bg: #eef1f4;
  --ink: #161c22;
  --muted: #5c6670;
  --line: #d9dee3;
  --link: #0b6e8a;
  --cta: #f2b233;
  --cta-ink: #1b1406;
  --head: #141c27;
  --head-ink: #f3f5f8;
  --head-muted: #a6b0c0;
  --ok: #1f7a4d;
  --ok-soft: #dcf1e5;
  --warn: #8d5a00;
  --warn-soft: #fcefd6;
  --stop: #b23a2a;
  --stop-soft: #fbe5e1;
  --shadow: 0 1px 2px rgba(20, 28, 39, 0.06), 0 8px 22px rgba(20, 28, 39, 0.08);
  --display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #161c22; --surface-2: #1f262e; --img-bg: #1c2430; --ink: #e8ecf0; --muted: #9ba6b2; --line: #2b343e;
    --link: #5ec6e4; --head: #0a0e14; --head-ink: #eef1f6; --head-muted: #8c97a8;
    --ok: #5fd29a; --ok-soft: #133426; --warn: #f2bd61; --warn-soft: #34260f; --stop: #f2897a; --stop-soft: #3a1c18;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #161c22; --surface-2: #1f262e; --img-bg: #1c2430; --ink: #e8ecf0; --muted: #9ba6b2; --line: #2b343e;
  --link: #5ec6e4; --head: #0a0e14; --head-ink: #eef1f6; --head-muted: #8c97a8;
  --ok: #5fd29a; --ok-soft: #133426; --warn: #f2bd61; --warn-soft: #34260f; --stop: #f2897a; --stop-soft: #3a1c18;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 6px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1180px; margin: 0 auto; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--link); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.note { font-size: 13px; color: var(--muted); }
.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: var(--cta); color: var(--cta-ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.block { width: 100%; }
.rnote { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }

/* ---------- Console screens ---------- */
.console { padding-block: 32px 64px; }
.console .inner { display: grid; gap: 28px; }
.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.intro-text { display: grid; gap: 18px; min-width: 0; }
.intro h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; letter-spacing: -0.015em; }
.lead { font-size: 17px; max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.fact { border-top: 2px solid var(--link); padding-top: 10px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.fact h3 { font-size: 15px; font-family: var(--body); font-weight: 700; }
.fact ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 21px; }
.field { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .legend { font-size: 13px; font-weight: 700; padding: 0; }
.text-input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input, .choice input { accent-color: var(--link); }
.check input { margin-top: 4px; }
.center { padding-block: 40px 80px; }
.center .inner { max-width: 680px; display: grid; gap: 18px; }
.boxcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 26px; display: grid; gap: 14px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.langbar { display: flex; gap: 6px; justify-content: flex-end; }
.langbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.langbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- Trip frame ---------- */
.trip { padding-block: 16px 48px; }
.trip .inner { display: grid; gap: 14px; }
.hud { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; width: 100%; }
.hud-pill { font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.hud-pill.practice { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.hud-wallet { margin-left: auto; font-size: 14px; color: var(--muted); }
.hud-wallet b { font-family: var(--mono); font-size: 18px; color: var(--ink); margin-left: 6px; font-variant-numeric: tabular-nums; }
.hud-help { border: 0; background: none; color: var(--link); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
.help { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; max-width: 540px; }

/* ---------- Store switcher (walk-in) ---------- */
.shops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.shopcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.shopcard .sc-icon { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.shopcard.m .sc-icon { background: #1f4d3a; color: #fdfaf2; }
.shopcard.n .sc-icon { background: #120e16; color: #ff6fae; }
.shopcard b { display: block; font-family: var(--display); font-size: 17px; }
.shopcard small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.shopcard .sc-state { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.shopcard[aria-pressed="true"] { border-color: var(--cta); background: var(--warn-soft); }
.shopcard[aria-pressed="true"] .sc-state { background: var(--cta); color: var(--cta-ink); }
.shopcard:not([aria-pressed="true"]):hover { border-color: var(--link); }

/* ---------- Walk-in scene: store photo with products placed on its shelves ---------- */
.pscroll { border-radius: 18px; overflow-x: auto; overflow-y: hidden; box-shadow: var(--shadow); background: #111; scrollbar-width: thin; }
.pscene { position: relative; width: 100%; min-width: 1100px; aspect-ratio: 1672 / 941; user-select: none; }
.pscene .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.item { position: absolute; transform: translateX(-50%); border: 0; padding: 0; background: none; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; }
.item img { height: 100%; width: auto; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.12s ease; }
.item img + img { margin-left: -38%; }
.item:hover img, .item:focus-visible img { transform: translateY(-4px); }
.item:active img { transform: translateY(-1px) scale(0.98); }
.item .qbadge { position: absolute; top: -6px; right: -10px; background: #f2b233; color: #1b1406; font-weight: 800; font-size: 12px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
.gap { position: absolute; transform: translateX(-50%); aspect-ratio: 2 / 3; border: 2px dashed rgba(255, 255, 255, 0.7); border-radius: 6px; background: rgba(0, 0, 0, 0.08); }
.ptag { position: absolute; transform: translateX(-50%); display: grid; justify-items: center; gap: 0; box-sizing: border-box; background: #fff; color: #1d2420; border: 0; border-top: 3px solid #f2b233; border-radius: 3px; padding: 3px 6px 4px; line-height: 1.15; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28); font-family: var(--body); cursor: pointer; text-align: center; }
.ptag b { font-size: 11px; font-weight: 700; line-height: 1.15; }
.ptag span { font-size: 10.5px; color: #4c5352; }
.ptag em { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 13px; }
.ptag.off { border-top-color: #c8352a; cursor: default; }
.ptag.off span { color: #b3261e; font-weight: 700; }
.northside .ptag { border-top-color: #ff6fae; }
.tent { position: absolute; transform: translate(-50%, -100%); background: #111; color: #ffd43b; border-radius: 4px; padding: 5px 8px 6px; display: grid; justify-items: center; line-height: 1.1; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); text-align: center; max-width: 130px; }
.tent b { font-family: var(--display); font-size: 11.5px; letter-spacing: 0.08em; }
.tent small { font-size: 10px; color: #f3f5f8; }
.tent.glass { transform: translate(-50%, -100%); }
.northside .tent { color: #ff8cc0; border: 1px solid #ff6fae; }
.pscene .bubble { position: absolute; margin: 0; background: #ffffff; color: #1d2420; border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 13.5px; max-width: 230px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
.pnotice { position: absolute; transform: translateX(-50%); width: 300px; }
.pnotice .notice-sign { width: 100%; }
.policy-banner { display: flex; align-items: center; gap: 14px; background: #b3261e; color: #fff; border-radius: 14px; padding: 14px 18px; box-shadow: 0 6px 18px rgba(179, 38, 30, 0.28); }
.policy-banner svg { flex: none; }
.policy-banner div { display: grid; gap: 2px; min-width: 0; }
.policy-banner .pb-kind { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffd9d4; }
.policy-banner b { font-family: var(--display); font-size: clamp(19px, 2.6vw, 24px); line-height: 1.15; }
.policy-banner > div > span:last-child { font-size: 15px; color: #fff; }
.swipe-hint { display: none; font-size: 12px; color: var(--muted); margin: -6px 0 0; }
@media (max-width: 900px) { .swipe-hint { display: block; } }
@media (max-width: 700px) { .basket { position: static; } }
.shopcard .sc-photo { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; display: block; flex: none; }
.notice-sign { position: relative; z-index: 2; width: min(360px, 100%); background: #fffef6; color: #22201a; border-radius: 4px; padding: 10px 12px; transform: rotate(1.2deg); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3); font-size: 13px; line-height: 1.35; }
.notice-sign::before { content: ""; position: absolute; top: -8px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(240, 220, 150, 0.85); transform: rotate(-3deg); }
.notice-sign b { display: block; font-family: var(--display); font-size: 15px; letter-spacing: 0.02em; color: #b3261e; margin-bottom: 2px; }
.notice-sign.dark { background: #1a141d; color: #ffd6e8; transform: rotate(-1deg); border: 1px solid #ff6fae; }
.notice-sign.dark b { color: #ff6fae; }
.notice-sign.dark::before { display: none; }
img.ph { object-fit: contain; display: block; }
.bline img.ph { width: 22px; height: 28px; }
.ocard-img, .sheet-img, .line-img { position: relative; overflow: hidden; }
.ocard-img img.ph, .sheet-img img.ph, .line-img img.ph { position: absolute; inset: 0; margin: auto; max-width: none; object-fit: contain; }
.ocard-img img.ph { width: 72%; height: 78%; }
.sheet-img img.ph { width: 64%; height: 78%; }
.line-img img.ph { width: 78%; height: 84%; }
.ocard-img .ribbon, .ocard-img .gone-label { z-index: 1; }
.ocard.gone .ocard-img img.ph { opacity: 0.35; filter: grayscale(1); }

/* ---------- Basket bar (walk-in) ---------- */
.basket { position: sticky; bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 28, 39, 0.22); padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 14px; align-items: center; }
.basket > .alertbar { grid-column: 1 / -1; }
.basket h2 { font-size: 16px; white-space: nowrap; }
.basket .tot { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; line-height: 1.3; }
.basket .tot b { color: var(--ink); font-size: 16px; }
.blines { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; min-width: 0; scrollbar-width: thin; padding-bottom: 2px; }
.bline { flex: none; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px 4px 3px 3px; font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.bline svg { width: 22px; height: 28px; }
.bline .where { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
.bline .stepper button { width: 26px; height: 26px; }
.basket-empty { font-size: 14px; color: var(--muted); min-width: 0; }
.basket .btn { white-space: nowrap; }

/* ---------- Alerts (device, money) ---------- */
.alertbar { display: grid; gap: 8px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.alertbar b { color: var(--warn); }
.alertbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.alertbar .btn { padding: 8px 14px; font-size: 14px; }
.online-alert { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(560px, calc(100% - 32px)); box-shadow: 0 10px 30px rgba(20, 28, 39, 0.25); background: var(--surface); }
.online-alert .alertbar { background: var(--warn-soft); }

/* ---------- Online shop ---------- */
.head { background: var(--head); color: var(--head-ink); padding-block: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body.online-mode::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
.head .inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--head-ink); }
.logo-text { display: grid; line-height: 1.05; }
.logo-text b { font-family: var(--display); font-size: 19px; font-weight: 700; }
.logo-text span { font-size: 11px; color: var(--head-muted); letter-spacing: 0.08em; text-transform: uppercase; }
.search { position: relative; min-width: 0; }
.search input { width: 100%; border: 0; border-radius: 999px; padding: 10px 16px 10px 40px; background: var(--surface); color: var(--ink); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.cart-btn { position: relative; background: transparent; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 7px 14px 7px 12px; display: flex; gap: 8px; align-items: center; color: var(--head-ink); font-weight: 600; }
.badge { position: absolute; top: -6px; right: -6px; background: var(--cta); color: var(--cta-ink); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px; }
.otask { background: var(--surface-2); padding-block: 8px; }
.otask .help { margin-top: 8px; }
.cats { background: var(--surface); border-bottom: 1px solid var(--line); }
.cats .inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.cat { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cat[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--cta); }
.store-main { padding-block: 20px 80px; }
.store-main .inner { display: grid; gap: 18px; }
.onotice { display: flex; flex-direction: column; gap: 2px; background: var(--stop-soft); border-radius: 12px; padding: 12px 16px; }
.onotice b { font-size: 15px; }
.onotice span { color: var(--muted); }
.toolbar { display: flex; justify-content: flex-end; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--surface); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; }
.sec { display: grid; gap: 10px; }
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.ocard { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto 1fr; overflow: hidden; min-width: 0; border: 1px solid transparent; }
.ocard.in-cart { border-color: var(--cta); }
.ocard-img { position: relative; background: var(--img-bg); aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; border: 0; padding: 0; width: 100%; }
.ocard-img svg { width: 62%; height: 78%; }
.ribbon { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 7px; }
.ribbon.mkt { background: var(--warn-soft); color: var(--warn); }
.ribbon.zero { background: var(--ok-soft); color: var(--ok); }
.ribbon.lock { background: var(--surface); color: var(--link); }
.ocard.gone .ocard-img svg { opacity: 0.35; filter: grayscale(1); }
.gone-label { position: absolute; inset: auto 10px 10px 10px; background: var(--surface); color: var(--stop); font-size: 12px; font-weight: 700; border-radius: 8px; padding: 6px 8px; text-align: center; }
.ocard-body { padding: 12px 14px 14px; display: grid; gap: 2px; grid-template-rows: auto auto auto 1fr auto; }
.brandline { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.oname { font-weight: 700; font-size: 16px; line-height: 1.25; background: none; border: 0; padding: 0; text-align: left; }
.oname:hover { color: var(--link); }
.ometa { font-size: 13px; color: var(--muted); }
.obuy { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; min-height: 38px; flex-wrap: wrap; }
.price { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.add { border: 0; background: var(--cta); color: var(--cta-ink); font-weight: 700; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.add:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.promo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }

/* Shared: steppers, sheets, drawer, receipt, modal */
.stepper { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface); font-size: 18px; font-weight: 700; line-height: 1; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.qty { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.5); z-index: 40; }
.sheet { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.sheet-img { background: var(--img-bg); display: grid; place-items: center; min-height: 280px; }
.sheet-img svg { width: 50%; height: 70%; }
.sheet-body { padding: 24px; display: grid; gap: 10px; align-content: start; position: relative; }
.sheet-body h2 { font-size: 24px; padding-right: 36px; }
.x { position: absolute; top: 12px; right: 12px; background: none; border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 22px; line-height: 1; }
.x:hover { background: var(--surface-2); }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-weight: 600; }
.buyrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.buyrow .price { font-size: 26px; }
.warnbox { border: 2px solid var(--ink); padding: 8px 10px; font-size: 12.5px; font-weight: 700; line-height: 1.35; }
.devnote { font-size: 13px; color: var(--muted); }
.devprompt { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; font-size: 14px; }
.devprompt .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.gonebox { color: var(--stop); background: var(--stop-soft); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); z-index: 50; display: grid; grid-template-rows: auto 1fr auto; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 20px; }
.drawer-head .x { position: static; }
.lines { overflow-y: auto; padding: 8px 20px; display: grid; align-content: start; }
.line { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); }
.line-img { width: 56px; height: 56px; border-radius: 10px; background: var(--img-bg); display: grid; place-items: center; }
.line-img svg { width: 60%; height: 80%; }
.line-name { font-weight: 700; font-size: 14px; }
.line-sub { font-size: 12px; color: var(--muted); }
.line-right { display: grid; gap: 6px; justify-items: end; }
.drawer-foot { border-top: 1px solid var(--line); padding: 16px 20px 20px; display: grid; gap: 10px; }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.row b { font-variant-numeric: tabular-nums; }
.row.total { font-size: 17px; font-weight: 700; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--ok); }
.cart-empty { padding: 40px 0; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.receipt { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: #fffdf7; color: #222; font-family: var(--mono); font-size: 13px; padding: 22px 20px 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); display: grid; gap: 8px; }
.receipt h3 { font-family: var(--mono); text-align: center; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.receipt .r { display: flex; justify-content: space-between; gap: 10px; }
.receipt .rule { border-top: 1px dashed #999; margin-block: 4px; }
.receipt .c { text-align: center; color: #555; }
.receipt button { margin-top: 8px; font-family: var(--body); }
.modal { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(400px, calc(100% - 32px)); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.modal svg.idcard { width: 160px; height: 100px; }

/* ---------- Results ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); }
th.num { text-align: right; }
tr.excluded td { color: var(--muted); }
.spendbar { display: inline-block; height: 8px; border-radius: 4px; background: var(--link); vertical-align: middle; margin-right: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
textarea.csv { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 10px; }
.toast { font-size: 13px; color: var(--ok); }
.profile-grid { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.profile-grid > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.profile-grid dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.profile-grid dd { margin: 0; font-weight: 700; font-size: 16px; }
.flags { display: grid; gap: 8px; }
.flag { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; flex: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.check { background: var(--warn-soft); color: var(--warn); }

@media (max-width: 860px) {
  .sheet { grid-template-columns: minmax(0, 1fr); }
  .sheet-img { min-height: 200px; }
  .head .inner { grid-template-columns: minmax(0, 1fr) auto; }
  .search { grid-column: 1 / -1; grid-row: 2; }
  .promo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  .basket { grid-template-columns: minmax(0, 1fr) auto; }
  .basket .blines, .basket .basket-empty { grid-column: 1 / -1; grid-row: 2; }
  .basket .tot { text-align: left; }
  .basket > .btn { grid-column: 1 / -1; width: 100%; }
  .basket .basket-empty { display: none; }
}
@media (max-width: 560px) {
  .shops { gap: 8px; }
  .shopcard { grid-template-columns: minmax(0, 1fr); padding: 8px 10px; gap: 2px; }
  .shopcard .sc-photo, .shopcard .sc-state { display: none; }
  .shopcard b { font-size: 14px; }
  .shopcard small { font-size: 11.5px; }
}
@media (max-width: 480px) {
  .ogrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ocard-body { padding: 10px; }
  .price { font-size: 18px; }
  .logo-text span { display: none; }
  .hud-wallet { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .stack .frontrow { transition: none; } }
</style>

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffleWith(a, r) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function williams(n) {
  const first = [0]; let lo = 1, hi = n - 1, up = true;
  while (first.length < n) { first.push(up ? lo++ : hi--); up = !up; }
  const rows = []; for (let r = 0; r < n; r++) rows.push(first.map(x => (x + r) % n));
  if (n % 2 === 1) rows.slice().forEach(row => rows.push(row.slice().reverse()));
  return rows;
}

  });
}

  const shopBtn = hit("[data-shop]"); if (shopBtn) { walkTo(shopBtn.dataset.shop); return; }
  if (hit("#checkout")) { const any = Object.keys(S.t.counter.mercer).length || Object.keys(S.t.counter.northside).length;
    if (!any) { finishTrip(); return; } if (Object.keys(S.t.counter.mercer).length) { u.idcheck = true; renderOverlay(); } else payWalkin(); return; }
  if (hit("#open-cart") || hit("#checkout-bottom")) { u.drawer = true; renderOverlay(); return; }
  if (hit("#place")) { if (!cartCount()) { u.drawer = false; finishTrip(); return; } if (PRODUCTS.some(p => p.licensed && S.t.cart[p.id])) { u.drawer = false; u.idcheck = true; renderOverlay(); } else placeOnline(); return; }
  const cat = hit("[data-cat]"); if (cat) { u.cat = cat.dataset.cat; keepScroll(renderTrip); return; }
});
const hoverKey = el => el && el.closest ? el.closest("[data-pid],[data-view]") : null;
const hoverId = el => el.dataset.pid || el.dataset.view;
document.addEventListener("pointerover", e => { if (!onTrip() || e.target.closest("#overlay")) return; const v = hoverKey(e.target); if (v) hoverStart(hoverId(v)); });
document.addEventListener("pointerout", e => { if (!onTrip()) return; const v = hoverKey(e.target); const to = hoverKey(e.relatedTarget); if (v && (!to || hoverId(to) !== hoverId(v))) hoverEnd(); });
document.addEventListener("input", e => {
  if (e.target.id === "q" && S.channel === "online") { S.ui.q = e.target.value; const pos = e.target.selectionStart; keepScroll(renderTrip); const q = document.getElementById("q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} } }
});
document.addEventListener("change", e => { if (e.target.id === "sort") { S.ui.sort = e.target.value; keepScroll(renderTrip); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.ui && (S.ui.sheet || S.ui.drawer) && !S.ui.receipt && !S.ui.idcheck) { S.ui.sheet = null; S.ui.drawer = false; keepScroll(renderTrip); } });
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("#restart")) { disposeThree(); hoverEnd(); S.step = 0; S.lang = "en"; S.t = null; S.ui = {}; renderSetup(); window.scrollTo(0, 0); } });
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

function itemsFrom(bag) { const tr = trip(); return PRODUCTS.filter(p => bag[p.id]).map(p => ({ id: p.id, licensed: p.licensed, name: fullName(shown(p, tr)), qty: bag[p.id], price: priceOf(p, tr) })); }
function settle(items) {
  const sub = items.reduce((s, it) => s + it.qty * it.price, 0); const tax = round2(items.reduce((s, it) => s + (it.licensed ? it.qty * it.price * TAX : 0), 0));
  const total = round2(sub + tax); items.forEach(it => { S.t.paid[it.id] = (S.t.paid[it.id] || 0) + it.qty; }); S.t.wallet = round2(S.t.wallet - total);
  return { sub, tax, total };
}
function stamp() { return new Date().toLocaleString(S.lang === "es" ? "es-US" : "en-US", { dateStyle: "medium", timeStyle: "short" }); }
function payWalkin() {
  const shops = ["mercer", "northside"].filter(k => Object.keys(S.t.counter[k]).length);
  const items = shops.flatMap(k => itemsFrom(S.t.counter[k]).map(it => Object.assign(it, { name: (shops.length > 1 ? (k === "mercer" ? "Mercer · " : "Northside · ") : "") + it.name })));
  const m = settle(items); shops.forEach(k => { S.t.counter[k] = {}; });
  S.ui.receipt = Object.assign({ shop: shops.map(k => shopMeta(k).name).join(" + "), time: stamp(), items, left: S.t.wallet }, m);
  renderOverlay();
}
function placeOnline() {
  const items = itemsFrom(S.t.cart); const m = settle(items); S.t.cart = {}; S.ui.drawer = false;
  S.ui.receipt = Object.assign({ online: true, shop: L("Order confirmation", "Confirmación de pedido"), time: stamp(), items, left: S.t.wallet }, m);
  renderOverlay();
}

function finishTrip() {
  hoverEnd(); disposeThree();
  const tr = trip(); const secs = Math.round((Date.now() - S.t.start) / 1000); const ts = new Date().toISOString();
  let store = 0, illicit = 0, cig = 0, nrt = 0, dev = 0, mg = 0;
  PRODUCTS.forEach(p0 => {
    const p = shown(p0, tr); const q = S.t.paid[p.id] || 0; const pr = priceOf(p, tr);
    mg += q * p.nicMg;
    if (p.cat === "cig") cig += q; else if (p.cat === "nrt") nrt += q; else if (p.cat === "device") dev += q; else if (p.licensed) store += q; else illicit += q;
    S.rows.push(Object.assign({ record: "trip_item", study_id: S.cfg.pid, sample: S.cfg.sample }, S.profile, { williams_seq: S.order.seqIndex + 1,
      trip_no: S.tripNo + 1, trip_type: tr.type, counted: tr.type === "practice" ? 0 : 1, policy_position: tr.pos || 0, policy: tr.policy, prev_policy: tr.prev, price_mult: tr.mult,
      product_id: p.id, product: fullName(p, p.name[0]), seller: p.licensed ? "licensed" : "unofficial", category: p.cat, available: available(p, tr.policy) ? 1 : 0,
      device: p.device, nicotine_pct: p.nic === null ? "NA" : p.nic, flavor: p.flavor, flavor_class: p.fclass, cooling: p.cool ? 1 : 0, age_lock: p.lock ? 1 : 0, needs_device: p.needs || "",
      price: pr.toFixed(2), tax_rate: p.licensed ? TAX : 0, qty: q, spend_pre_tax: (q * pr).toFixed(2), nic_mg_unit: p.nicMg, nic_mg_bought: q * p.nicMg,
      times_examined: S.t.views[p.id] || 0, first_view_rank: S.t.firstView[p.id] || 0, hover_ms: Math.round(S.t.hover[p.id] || 0), put_backs: S.t.putBack[p.id] || 0,
      id_checks: S.t.idChecks, device_prompts: S.t.devPrompts, device_alert_add_clicks: S.t.devAdded, device_at_home: S.t.devHome.join(";"), own_money_added: S.t.extra.toFixed(2), money_prompts: S.t.moneyPrompts, smoke_shop_visits: S.t.visits, trip_seconds: secs, wallet_left: S.t.wallet.toFixed(2), timestamp: ts }));
  });
  const spent = round2(S.budget + S.t.extra - S.t.wallet); const kept = round2(S.budget - spent);
  const cheapest = Math.min(...PRODUCTS.filter(p => available(p, tr.policy)).map(p => withTax(p, priceOf(p, tr))));
  S.summaries.push({ no: S.tripNo, type: tr.type, policy: tr.policy, mult: tr.mult, store, illicit, cig, nrt, dev, mg, spent, own: S.t.extra, kept, secs, visits: S.t.visits, capped: S.budget - spent < cheapest, basket: JSON.stringify(S.t.paid) });
  document.body.classList.remove("online-mode"); overlay.innerHTML = "";
  next();
}

/* ===================== Debrief ===================== */
function renderDebrief() {
  document.body.classList.remove("online-mode");
  const feats = [["Price", "Precio"], ["Flavor", "Sabor"], ["Nicotine strength", "Nicotina"], ["Device type", "Tipo de dispositivo"], ["Seller", "Vendedor"], ["None, I considered everything", "Ninguna, consideré todo"]];
  app.innerHTML = `<main class="center gutter"><div class="inner">
    <span class="eyebrow">${L("Last step", "Última parte")}</span><h1 style="font-size:28px">${L("Three quick questions", "Tres preguntas rápidas")}</h1>
    <form class="panel" id="deb">
      <fieldset class="field"><legend class="legend" style="margin-bottom:6px">1. ${L("How realistic did the shopping trips feel?", "¿Qué tan realistas se sintieron las compras?")}</legend><div class="choice-row">${[1, 2, 3, 4, 5].map(v => `<label class="choice"><input type="radio" name="real" id="real-${v}" value="${v}" ${v === 4 ? "checked" : ""} required> ${v}${v === 1 ? " · " + L("Not at all", "Nada") : v === 5 ? " · " + L("Very", "Mucho") : ""}</label>`).join("")}</div></fieldset>
      <fieldset class="field"><legend class="legend" style="margin-bottom:6px">2. ${L("Which features did you ignore when choosing? (select any)", "¿Qué características ignoraste al elegir? (marca las que apliquen)")}</legend><div class="choice-row">${feats.map(([f, es], k) => `<label class="choice"><input type="checkbox" name="ign" id="ign-${k}" value="${esc(f)}"> ${esc(L(f, es))}</label>`).join("")}</div></fieldset>
      <div class="field"><label for="purpose">3. ${L("In a few words, what do you think this study is about?", "En pocas palabras, ¿de qué crees que trata este estudio?")}</label><input class="text-input" id="purpose" value="${L("How people shop for vapes when prices change", "Cómo compra la gente vapes cuando cambian los precios")}"></div>
      <button class="btn" type="submit">${L("Finish and see my bonus", "Terminar y ver mi bono")}</button>
    </form></div></main>`;
  document.getElementById("deb").addEventListener("submit", e => {
    e.preventDefault();
    const counted = S.summaries.filter(s => s.type !== "practice"); const pickT = counted[hashStr(S.cfg.pid + "bonus") % counted.length];
    S.debrief = { realism: Number(document.querySelector('input[name="real"]:checked').value), ignored: [...document.querySelectorAll('input[name="ign"]:checked')].map(x => x.value).join("; "), purpose: document.getElementById("purpose").value, bonus_trip: pickT.no + 1, bonus: Math.max(0, pickT.kept) };
    app.innerHTML = `<main class="center gutter"><div class="inner"><div class="boxcard">
      <span class="eyebrow">${L("Thank you", "Gracias")}</span><h1 style="font-size:28px">${L("Your bonus", "Tu bono")}: ${money(Math.max(0, pickT.kept))}</h1>
      <p class="muted">${L(`Trip ${pickT.no + 1} was picked at random. You kept ${money(Math.max(0, pickT.kept))} of that week's money, so that is your bonus.`, `Se eligió la compra ${pickT.no + 1} al azar. Te quedaste con ${money(Math.max(0, pickT.kept))} del dinero de esa semana, así que ese es tu bono.`)}</p>
      <p class="note">${L("Demo only. In the study, the bonus is paid with the regular incentive.", "Solo demo. En el estudio, el bono se paga con el incentivo habitual.")}</p>
      <div><button type="button" class="btn" id="next">Open the researcher view</button></div></div></div></main>`;
    document.getElementById("next").addEventListener("click", next);
  });
}

/* ===================== Researcher results ===================== */
function toCSV(rows) { const cols = [...new Set(rows.flatMap(r => Object.keys(r)))]; return [cols.join(","), ...rows.map(r => cols.map(c => `"${String(r[c] == null ? "" : r[c]).replace(/"/g, '""')}"`).join(","))].join("\n"); }
function renderEnd() {
  document.body.classList.remove("online-mode");
  const P = S.profile; const sums = S.summaries; const maxSpend = Math.max(1, ...sums.map(s => s.spent));
  const label = s => s.type === "practice" ? "Practice (excluded)" : s.type === "baseline" ? "Baseline" : POLICIES[s.policy].label;
  const tRows = sums.map(s => `<tr class="${s.type === "practice" ? "excluded" : ""}"><td class="num">${s.no + 1}</td><td>${esc(label(s))}</td><td class="num">×${s.mult.toFixed(1)}</td><td class="num">${s.store}</td><td class="num">${s.illicit}</td><td class="num">${s.cig}</td><td class="num">${s.nrt}</td><td class="num">${s.dev}</td><td class="num">${s.mg}</td><td><span class="spendbar" style="width:${Math.round((s.spent / maxSpend) * 70)}px"></span><span class="mono">${money(s.spent)}</span></td><td class="num">${s.own ? money(s.own) : "—"}</td><td class="num">${money(s.kept)}</td><td class="num">${s.secs}s</td></tr>`).join("");
  const counted = sums.filter(s => s.type !== "practice");
  const flags = [
    ["Same basket on every counted trip", counted.length > 1 && new Set(counted.map(s => s.basket)).size === 1],
    ["Any counted trip under 8 seconds", counted.some(s => s.secs < 8)],
    ["Budget ran out on " + counted.filter(s => s.capped).length + " trip(s)", counted.some(s => s.capped)]
  ];
  const flagHtml = flags.map(([t, bad]) => `<div class="flag"><span class="pill ${bad ? "check" : "ok"}">${bad ? "Check" : "OK"}</span><span>${esc(t)}</span></div>`).join("");
  const attn = S.rows.filter(r => r.counted === 1).reduce((a, r) => { a.views += r.times_examined; a.hover += r.hover_ms; a.puts += r.put_backs; return a; }, { views: 0, hover: 0, puts: 0 });
  const D = S.debrief;
  app.innerHTML = `<main class="console gutter"><div class="inner">
    <div style="display:grid;gap:8px"><span class="eyebrow">Researcher view</span><h1 style="font-size:clamp(28px,4vw,40px)">What the study records</h1>
      <p class="lead muted">This is the data from the session you just completed (demo ID ${esc(S.cfg.pid)}): ${S.channel === "online" ? "online shop" : "walk-in store, " + esc(P.display_mode)}, ${S.lang === "es" ? "Spanish" : "English"}, policy order ${S.order.seqIndex + 1} of ${S.order.nSeqs}.</p></div>
    <div class="sec"><h2>Participant profile</h2><dl class="profile-grid">
      <div><dt>Age</dt><dd>${P.age}</dd></div><div><dt>Usual device</dt><dd>${esc(P.usual_device)}</dd></div><div><dt>Usual flavor</dt><dd>${esc(P.usual_flavor)}</dd></div>
      <div><dt>Usual strength</dt><dd>${esc(P.usual_nicotine)}</dd></div><div><dt>Days vaped, past 30</dt><dd>${P.days_vaped_30}</dd></div><div><dt>Weekly spend</dt><dd>${money(P.weekly_spend)}</dd></div>
      <div><dt>Store budget</dt><dd>${money(P.budget)}</dd></div><div><dt>Usually buys at</dt><dd>${esc(P.usual_source)}</dd></div><div><dt>Cigarettes, past 30 days</dt><dd>${P.cig_past30 ? "Yes (dual use)" : "No"}</dd></div>
      <div><dt>Owns a device</dt><dd>${P.owns_pod_device ? "Lumen pod device" : P.owns_tank ? "Driftline tank" : "None"}</dd></div>
    </dl><p class="note">For past lab participants, the study ID also links this profile to their archived baseline and lab-session data.</p></div>
    <div class="sec"><h2>Shopping trips</h2><div class="table-wrap"><table><thead><tr><th class="num">Trip</th><th>Policy</th><th class="num">E-cig price</th><th class="num">Store e-cigs</th><th class="num">Unofficial</th><th class="num">Cig packs</th><th class="num">Gum</th><th class="num">Devices</th><th class="num">Nicotine mg</th><th>Spent (with tax)</th><th class="num">Own money</th><th class="num">Kept</th><th class="num">Time</th></tr></thead><tbody>${tRows}</tbody></table></div>
      <p class="note">Nicotine mg is approximate nicotine content of the products bought, not the dose delivered. Attention across counted trips: ${attn.views} product views, ${Math.round(attn.hover / 1000)} s of look time, ${attn.puts} put-backs.</p></div>
    <div class="sec"><h2>Data quality checks</h2><div class="flags">${flagHtml}</div></div>
    <div class="sec"><h2>Debrief</h2><dl class="profile-grid"><div><dt>Realism (1–5)</dt><dd>${D.realism}</dd></div><div><dt>Features ignored</dt><dd>${esc(D.ignored || "None")}</dd></div><div><dt>Guessed purpose</dt><dd>${esc(D.purpose || "—")}</dd></div><div><dt>Bonus trip</dt><dd>Trip ${D.bonus_trip} · ${money(D.bonus)}</dd></div></dl></div>
    <div class="sec"><h2>Export</h2><div class="actions"><button class="btn" type="button" id="copy-store">Copy store data (CSV)</button><button class="btn ghost" type="button" id="again">Run another session</button><span class="toast" id="toast" aria-live="polite"></span></div>
      <p class="note">${S.rows.length} store rows (one per product per trip).</p>
      <textarea class="csv" id="csv" readonly hidden aria-label="CSV data"></textarea></div>
  </div></main>`;
  const copy = rows => { const csv = toCSV(rows); const ta = document.getElementById("csv"); const toast = document.getElementById("toast");
    const fallback = () => { ta.hidden = false; ta.value = csv; ta.focus(); ta.select(); toast.textContent = "The text below is selected. Copy it to save the data."; };
    try { navigator.clipboard.writeText(csv).then(() => { toast.textContent = "Copied " + rows.length + " rows."; }, fallback); } catch (err) { fallback(); } };
  document.getElementById("copy-store").addEventListener("click", () => copy(S.rows));
  document.getElementById("again").addEventListener("click", () => { S.step = 0; S.lang = "en"; renderSetup(); window.scrollTo(0, 0); });
}

renderSetup();
</script>

</body></html>

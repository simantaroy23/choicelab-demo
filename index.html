<style>
/* Layout: researcher setup -> profile (picks store channel + language) -> store trips (3D or 2D walk-in, or online shop) -> debrief -> researcher results */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #e9edef;
  --img-bg: #eef1f4;
  --ink: #161c22;
  --muted: #5c6670;
  --line: #d9dee3;
  --link: #0b6e8a;
  --cta: #f2b233;
  --cta-ink: #1b1406;
  --head: #141c27;
  --head-ink: #f3f5f8;
  --head-muted: #a6b0c0;
  --ok: #1f7a4d;
  --ok-soft: #dcf1e5;
  --warn: #8d5a00;
  --warn-soft: #fcefd6;
  --stop: #b23a2a;
  --stop-soft: #fbe5e1;
  --shadow: 0 1px 2px rgba(20, 28, 39, 0.06), 0 8px 22px rgba(20, 28, 39, 0.08);
  --display: "Outfit", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #161c22; --surface-2: #1f262e; --img-bg: #1c2430; --ink: #e8ecf0; --muted: #9ba6b2; --line: #2b343e;
    --link: #5ec6e4; --head: #0a0e14; --head-ink: #eef1f6; --head-muted: #8c97a8;
    --ok: #5fd29a; --ok-soft: #133426; --warn: #f2bd61; --warn-soft: #34260f; --stop: #f2897a; --stop-soft: #3a1c18;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #161c22; --surface-2: #1f262e; --img-bg: #1c2430; --ink: #e8ecf0; --muted: #9ba6b2; --line: #2b343e;
  --link: #5ec6e4; --head: #0a0e14; --head-ink: #eef1f6; --head-muted: #8c97a8;
  --ok: #5fd29a; --ok-soft: #133426; --warn: #f2bd61; --warn-soft: #34260f; --stop: #f2897a; --stop-soft: #3a1c18;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 22px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 6px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1180px; margin: 0 auto; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--link); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.note { font-size: 13px; color: var(--muted); }
.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: var(--cta); color: var(--cta-ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.block { width: 100%; }
.rnote { font-family: var(--mono); font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }

/* ---------- Console screens ---------- */
.console { padding-block: 32px 64px; }
.console .inner { display: grid; gap: 28px; }
.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.intro-text { display: grid; gap: 18px; min-width: 0; }
.intro h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; letter-spacing: -0.015em; }
.lead { font-size: 17px; max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.fact { border-top: 2px solid var(--link); padding-top: 10px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.fact h3 { font-size: 15px; font-family: var(--body); font-weight: 700; }
.fact ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 21px; }
.field { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .legend { font-size: 13px; font-weight: 700; padding: 0; }
.text-input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg); font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input, .choice input { accent-color: var(--link); }
.check input { margin-top: 4px; }
.center { padding-block: 40px 80px; }
.center .inner { max-width: 680px; display: grid; gap: 18px; }
.boxcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 26px; display: grid; gap: 14px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.langbar { display: flex; gap: 6px; justify-content: flex-end; }
.langbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.langbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- Trip frame ---------- */
.trip { padding-block: 16px 48px; }
.trip .inner { display: grid; gap: 14px; }
.hud { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; width: 100%; }
.hud-pill { font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.hud-pill.practice { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.hud-wallet { margin-left: auto; font-size: 14px; color: var(--muted); }
.hud-wallet b { font-family: var(--mono); font-size: 18px; color: var(--ink); margin-left: 6px; font-variant-numeric: tabular-nums; }
.hud-help { border: 0; background: none; color: var(--link); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
.help { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; max-width: 540px; }

/* ---------- Store switcher (walk-in) ---------- */
.shops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.shopcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.shopcard .sc-icon { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.shopcard.m .sc-icon { background: #1f4d3a; color: #fdfaf2; }
.shopcard.n .sc-icon { background: #120e16; color: #ff6fae; }
.shopcard b { display: block; font-family: var(--display); font-size: 17px; }
.shopcard small { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
.shopcard .sc-state { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.shopcard[aria-pressed="true"] { border-color: var(--cta); background: var(--warn-soft); }
.shopcard[aria-pressed="true"] .sc-state { background: var(--cta); color: var(--cta-ink); }
.shopcard:not([aria-pressed="true"]):hover { border-color: var(--link); }

/* ---------- Walk-in scene: store photo with products placed on its shelves ---------- */
.pscroll { border-radius: 18px; overflow-x: auto; overflow-y: hidden; box-shadow: var(--shadow); background: #111; scrollbar-width: thin; }
.pscene { position: relative; width: 100%; min-width: 1100px; aspect-ratio: 1672 / 941; user-select: none; }
.pscene .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.item { position: absolute; transform: translateX(-50%); border: 0; padding: 0; background: none; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; }
.item img { height: 100%; width: auto; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.12s ease; }
.item svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35)); transition: transform 0.12s ease; }
.item:hover svg, .item:focus-visible svg { transform: translateY(-4px); }
.shops.one { grid-template-columns: minmax(0, 1fr); }
.shops.one .shopcard { grid-template-columns: auto minmax(0, 1fr); cursor: default; }
.bactions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.other-btn { font-size: 13.5px; }
.choice-col { display: grid; gap: 6px; }
.modal.other-modal { display: grid; gap: 12px; max-height: calc(100vh - 32px); overflow-y: auto; width: min(480px, calc(100% - 32px)); text-align: left; }
.other-modal textarea { resize: vertical; font: inherit; }
.wbig svg { width: 100%; height: auto; display: block; border-radius: 4px; }
.other-cell { font-size: 12.5px; max-width: 260px; }
tr.delta td { border-top: 2px solid var(--ink); background: var(--surface-2); font-weight: 700; }
.item:hover img, .item:focus-visible img { transform: translateY(-4px); }
.item:active img { transform: translateY(-1px) scale(0.98); }
.item .qbadge { position: absolute; top: -6px; right: -10px; background: #f2b233; color: #1b1406; font-weight: 800; font-size: 12px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
.gap { position: absolute; transform: translateX(-50%); aspect-ratio: 2 / 3; border: 2px dashed rgba(255, 255, 255, 0.7); border-radius: 6px; background: rgba(0, 0, 0, 0.08); }
.ptag { position: absolute; transform: translateX(-50%); display: grid; justify-items: center; gap: 0; box-sizing: border-box; background: #fff; color: #1d2420; border: 0; border-top: 3px solid #f2b233; border-radius: 3px; padding: 3px 6px 4px; line-height: 1.15; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28); font-family: var(--body); cursor: pointer; text-align: center; }
.ptag b { font-size: 11px; font-weight: 700; line-height: 1.15; }
.ptag span { font-size: 10.5px; color: #4c5352; }
.ptag em { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 13px; }
.ptag.off { border-top-color: #c8352a; cursor: pointer; }
.clerk-hit { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 40% 40% 12px 12px; }
.clerk-hit:focus-visible { outline: 3px solid var(--cta); outline-offset: -3px; }
.pscene .bubble.pop { animation: bubblePop 0.32s cubic-bezier(.2, 1.4, .4, 1) both; transform-origin: 0% 100%; }
.pscene .bubble .who { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2e6b52; margin-bottom: 1px; }
@keyframes bubblePop { from { opacity: 0; transform: scale(0.7) translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pscene .bubble.pop { animation: none; } }
.ptag.off span { color: #b3261e; font-weight: 700; }
.tent { position: absolute; transform: translate(-50%, -100%); background: #111; color: #ffd43b; border-radius: 4px; padding: 5px 8px 6px; display: grid; justify-items: center; line-height: 1.1; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); text-align: center; max-width: 130px; }
.tent b { font-family: var(--display); font-size: 11.5px; letter-spacing: 0.08em; }
.tent small { font-size: 10px; color: #f3f5f8; }
.tent.glass { transform: translate(-50%, -100%); }
.pscene .bubble { position: absolute; margin: 0; background: #ffffff; color: #1d2420; border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: 13.5px; max-width: 230px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
.pnotice { position: absolute; transform: translateX(-50%); width: 300px; }
.pnotice .notice-sign { width: 100%; }
.policy-banner { display: flex; align-items: center; gap: 14px; background: #b3261e; color: #fff; border-radius: 14px; padding: 14px 18px; box-shadow: 0 6px 18px rgba(179, 38, 30, 0.28); }
.policy-banner svg { flex: none; }
.policy-banner div { display: grid; gap: 2px; min-width: 0; }
.policy-banner .pb-kind { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffd9d4; }
.policy-banner b { font-family: var(--display); font-size: clamp(19px, 2.6vw, 24px); line-height: 1.15; }
.policy-banner > div > span:last-child { font-size: 15px; color: #fff; }
.swipe-hint { display: none; font-size: 12px; color: var(--muted); margin: -6px 0 0; }
@media (max-width: 900px) { .swipe-hint { display: block; } }
@media (max-width: 700px) { .basket { position: static; } }
.shopcard .sc-photo { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; display: block; flex: none; }
.notice-sign { position: relative; z-index: 2; width: min(360px, 100%); background: #fffef6; color: #22201a; border-radius: 4px; padding: 10px 12px; transform: rotate(1.2deg); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3); font-size: 13px; line-height: 1.35; }
.notice-sign::before { content: ""; position: absolute; top: -8px; left: 50%; width: 46px; height: 16px; margin-left: -23px; background: rgba(240, 220, 150, 0.85); transform: rotate(-3deg); }
.notice-sign b { display: block; font-family: var(--display); font-size: 15px; letter-spacing: 0.02em; color: #b3261e; margin-bottom: 2px; }
.notice-sign.dark { background: #1a141d; color: #ffd6e8; transform: rotate(-1deg); border: 1px solid #ff6fae; }
.notice-sign.dark b { color: #ff6fae; }
.notice-sign.dark::before { display: none; }
img.ph { object-fit: contain; display: block; }
.bline img.ph { width: 22px; height: 28px; }
.ocard-img, .sheet-img, .line-img { position: relative; overflow: hidden; }
.ocard-img .ph, .sheet-img .ph, .line-img .ph { position: absolute; inset: 0; margin: auto; max-width: none; object-fit: contain; }
.ocard-img img.ph, .ocard-img svg.ph { width: 72%; height: 78%; }
.sheet-img img.ph, .sheet-img svg.ph { width: 64%; height: 78%; }
.line-img img.ph, .line-img svg.ph { width: 78%; height: 84%; }
.ocard-img .ribbon, .ocard-img .gone-label { z-index: 1; }
.ocard.gone .ocard-img .ph { opacity: 0.35; filter: grayscale(1); }

/* ---------- Basket bar (walk-in) ---------- */
.basket { position: sticky; bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 28, 39, 0.22); padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 14px; align-items: center; }
.basket > .alertbar { grid-column: 1 / -1; }
.basket h2 { font-size: 16px; white-space: nowrap; }
.basket .tot { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; text-align: right; line-height: 1.3; }
.basket .tot b { color: var(--ink); font-size: 16px; }
.blines { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; min-width: 0; scrollbar-width: thin; padding-bottom: 2px; }
.bline { flex: none; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px 4px 3px 3px; font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.bline svg { width: 22px; height: 28px; }
.bline .where { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
.bline .stepper button { width: 26px; height: 26px; }
.basket-empty { font-size: 14px; color: var(--muted); min-width: 0; }
.basket .btn { white-space: nowrap; }

/* ---------- Alerts (device, money) ---------- */
.alertbar { display: grid; gap: 8px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.alertbar b { color: var(--warn); }
.alertbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.alertbar .btn { padding: 8px 14px; font-size: 14px; }
.online-alert { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; width: min(560px, calc(100% - 32px)); box-shadow: 0 10px 30px rgba(20, 28, 39, 0.25); background: var(--surface); }
.online-alert .alertbar { background: var(--warn-soft); }

/* ---------- Online shop ---------- */
.head { background: var(--head); color: var(--head-ink); padding-block: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body.online-mode::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
.head .inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--head-ink); }
.logo-text { display: grid; line-height: 1.05; }
.logo-text b { font-family: var(--display); font-size: 19px; font-weight: 700; }
.logo-text span { font-size: 11px; color: var(--head-muted); letter-spacing: 0.08em; text-transform: uppercase; }
.search { position: relative; min-width: 0; }
.search input { width: 100%; border: 0; border-radius: 999px; padding: 10px 16px 10px 40px; background: var(--surface); color: var(--ink); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.cart-btn { position: relative; background: transparent; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px; padding: 7px 14px 7px 12px; display: flex; gap: 8px; align-items: center; color: var(--head-ink); font-weight: 600; }
.badge { position: absolute; top: -6px; right: -6px; background: var(--cta); color: var(--cta-ink); font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px; }
.otask { background: var(--surface-2); padding-block: 8px; }
.otask .help { margin-top: 8px; }
.cats { background: var(--surface); border-bottom: 1px solid var(--line); }
.cats .inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.cat { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cat[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--cta); }
.store-main { padding-block: 20px 80px; }
.store-main .inner { display: grid; gap: 18px; }
.onotice { display: flex; flex-direction: column; gap: 2px; background: var(--stop-soft); border-radius: 12px; padding: 12px 16px; }
.onotice b { font-size: 15px; }
.onotice span { color: var(--muted); }
.toolbar { display: flex; justify-content: flex-end; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--surface); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; }

// Builds one session: baseline trip + the participant's single assigned policy.
function buildSession(pid, asg) {
  const pol = CONFIG.groups[asg.group];
  S.cfg = { pid, mode: MODE, group: asg.group, policy: pol, allocation: asg.method, seq: asg.seq || "", notes: false };
  if (MODE === "study") store("choicelab_group_" + pid, asg.group);
  const seed = hashStr(pid);
  S.shelfOrder = shuffleWith(PRODUCTS.map(p => p.id), rng(seed ^ 0x9e3779b9));
  const trips = [{ type: "baseline", policy: "baseline", mult: 1 }, { type: "policy", policy: pol, mult: pol === "price_up" ? TAX_HIKE : 1, pos: 1 }];
  let prev = "none"; trips.forEach(tr => { tr.prev = prev; prev = tr.policy; });
  S.trips = trips; S.rows = []; S.summaries = []; S.debrief = null; S.profile = null; S.elig = null; S.sent = null;
  S.steps = ["profile", "storeIntro", "trip:0", "trip:1", "debrief", "end"];
  S.step = -1; next();
}

}
function renderTrip() { if (S.channel === "online") renderOnline(); else renderWalkin(); }
const POLICY_KIND = { flavor_ban: ["New rule", "Nueva regla"], nic_cap2: ["New rule", "Nueva regla"], warnings: ["New rule", "Nueva regla"], price_up: ["Price change", "Cambio de precios"] };
function policyBanner() {
  const tr = trip(); const sg = sign(tr.policy); if (!sg || tr.policy === "baseline") return "";

}
function hud() {
  const tr = trip(); const counted = S.trips.filter(t => t.type !== "practice"); const k = counted.indexOf(tr);
  const label = tr.type === "practice" ? L("Practice trip", "Compra de práctica") : L(`Trip ${k + 1} of ${counted.length}`, `Compra ${k + 1} de ${counted.length}`);

}
function researcherNote() {
  if (!S.cfg.notes) return "";
  const tr = trip();
  return `<p class="rnote">Researcher note · ${tr.type} · policy: ${tr.policy} · group ${S.cfg.group} · e-cig price ×${tr.mult.toFixed(1)} · display: ${S.display}</p>`;
}
function orderedProducts(filter) { return S.shelfOrder.map(byId).filter(filter); }
function allBags() { return S.channel === "online" ? [S.t.cart] : [S.t.counter.mercer]; }
function pendingTaxed() { const tr = trip(); let s = 0; allBags().forEach(b => PRODUCTS.forEach(p => { s += (b[p.id] || 0) * withTax(p, priceOf(p, tr)); })); return s; }
function room() { return S.t.wallet - pendingTaxed(); }
function bagOf(p) { return S.channel === "online" ? S.t.cart : S.t.counter.mercer; }
function canAdd(p) { return withTax(p, priceOf(p, trip())) <= room() + 1e-9; }
function hasDevice(dev) { return !!S.owns[dev] || allBags().some(b => b[dev] > 0) || (S.t.paid[dev] || 0) > 0; }
function stepper(p) {
  const q = bagOf(p)[p.id] || 0;
  return `<div class="stepper"><button type="button" data-act="dec" data-id="${p.id}" aria-label="${L("Remove one", "Quitar uno")}" ${q ? "" : "disabled"}>−</button><span class="qty" aria-live="polite">${q}</span><button type="button" data-act="inc" data-id="${p.id}" aria-label="${L("Add one", "Agregar uno")}" ${available(p, trip().policy) ? "" : "disabled"}>+</button></div>`;
}
function tryAdd(p) {
  const tr = trip(); if (!available(p, tr.policy)) return;
  const cost = withTax(p, priceOf(p, tr));
  if (cost > room() + 1e-9) { S.ui.alert = { type: "money", id: p.id, short: Math.max(1, Math.ceil(cost - room() - 1e-9)) }; S.t.moneyPrompts += 1; return; }
  const bag = bagOf(p); bag[p.id] = (bag[p.id] || 0) + 1;
  if (p.needs && !hasDevice(p.needs)) { S.ui.alert = { type: "device", pod: p.id, dev: p.needs }; S.t.devPrompts += 1; say("added"); }
  else { if (S.ui.alert) S.ui.alert = null; say("added"); }
}
function useOwnMoney() {
  const a = S.ui.alert; if (!a || a.type !== "money") return;

// Categories used for units and spending. "ends" = e-liquids, pods and disposables; devices counted separately.
const CATS_OUT = [["ends", "ecig"], ["device", "device"], ["cig", "cig"], ["cigar", "cigar"], ["pouch", "pouch"], ["nrt", "nrt"]];
// Fingerprint of what the store offers (availability + price + warning) under a policy. Baseline must match for every group.
function storeSignature(tr) { return hashStr(PRODUCTS.map(p => [p.id, available(p, tr.policy) ? 1 : 0, priceOf(p, tr), warned(p, tr.policy) ? 1 : 0].join(":")).join("|")).toString(16); }

    const k = CATS_OUT.find(c => c[1] === p.cat)[0]; units[k] += q; spend[k] += q * pr * (1 + TAX); mg += q * p.nicMg;

      trip_no: S.tripNo + 1, trip_type: tr.type, trip_policy: tr.policy, price_mult: tr.mult,
      product_id: p.id, product: fullName(p, p.name[0]), category: p.cat, available: available(p, tr.policy) ? 1 : 0,
      device: p.device, nicotine_pct: p.nic === null ? "NA" : p.nic, flavor: p.flavor, flavor_class: p.fclass, cooling: p.cool ? 1 : 0, needs_device: p.needs || "",
      price: pr.toFixed(2), tax_rate: TAX, warning_label: warned(p, tr.policy) ? 1 : 0, qty: q, spend_with_tax: (q * pr * (1 + TAX)).toFixed(2), nic_mg_unit: p.nicMg, nic_mg_bought: q * p.nicMg,
      times_examined: S.t.views[p.id] || 0, first_view_rank: S.t.firstView[p.id] || 0, hover_ms: Math.round(S.t.hover[p.id] || 0), put_backs: S.t.putBack[p.id] || 0, timestamp: ts });
  });

// One row per trip (long format, for within-person models).
function tripRows() {

    trip_no: s.no + 1, trip_type: s.type, trip_policy: s.policy, price_mult: s.mult, store_signature: s.sig, baseline_matches_standard: s.type === "baseline" ? (s.sig === BASELINE_SIG ? 1 : 0) : "" },
    Object.fromEntries(CATS_OUT.map(([k]) => ["units_" + k, s.units[k]])), { units_total: s.total },

// One row per participant (wide format, for between-group comparisons): baseline (b_), policy trip (p_) and change (d_ = p − b).
function participantRow() {
  const T = tripRows(); const b = T.find(r => r.trip_type === "baseline") || {}; const p = T.find(r => r.trip_type === "policy") || {};
  const keys = ["units_total", ...CATS_OUT.map(([k]) => "units_" + k), "spend_total", ...CATS_OUT.map(([k]) => "spend_" + k), "no_purchase", "nic_mg_bought", "own_money_added", "money_kept", "other_source", "other_source_spend", "trip_seconds"];
  const row = { record: "participant", data_mode: S.cfg.mode, study_id: S.cfg.pid, policy_group: S.cfg.group, assigned_policy: S.cfg.policy, allocation_method: S.cfg.allocation, allocation_seq: S.cfg.seq };
  Object.assign(row, S.profile || {});
  keys.forEach(k => { row["b_" + k] = b[k] ?? ""; }); keys.forEach(k => { row["p_" + k] = p[k] ?? ""; });
  keys.forEach(k => { const x = Number(b[k]), y = Number(p[k]); row["d_" + k] = b[k] === "" || p[k] === "" || b[k] == null || p[k] == null || isNaN(x) || isNaN(y) ? "" : String(round2(y - x)); });
  row.b_other_source_where = b.other_source_where ?? ""; row.p_other_source_where = p.other_source_where ?? "";
  row.b_other_source_text = b.other_source_text ?? ""; row.p_other_source_text = p.other_source_text ?? "";
  row.baseline_matches_standard = b.baseline_matches_standard ?? ""; row.trips_completed = T.length;

// Study mode only: post the record to the investigator's endpoint. Demo data is never sent.
async function sendRecord(status) {
  if (S.cfg.mode !== "study" || !CONFIG.dataEndpoint) { S.sent = CONFIG.dataEndpoint ? "skipped" : "no_endpoint"; return S.sent; }
  const body = JSON.stringify({ status, participant: participantRow(), trips: tripRows(), items: S.rows, app_version: "2026-11-12" });
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(CONFIG.dataEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body }); if (r.ok) { S.sent = "ok"; return "ok"; } } catch (e) {}

      <fieldset class="field"><legend class="legend" style="margin-bottom:6px">2. ${L("Which features did you ignore when choosing? (select any)", "¿Qué características ignoraste al elegir? (marca las que apliquen)")}</legend><div class="choice-row">${feats.map(([f, es], k) => `<label class="choice"><input type="checkbox" name="ign" id="ign-${k}" value="${esc(f)}"> ${esc(L(f, es))}</label>`).join("")}</div></fieldset>
      <div class="field"><label for="purpose">3. ${L("In a few words, what do you think this study is about?", "En pocas palabras, ¿de qué crees que trata este estudio?")}</label><input class="text-input" id="purpose" value="${demo ? L("How people shop for vapes when rules change", "Cómo compra la gente vapes cuando cambian las reglas") : ""}"></div>
      <button class="btn" type="submit">${L("Finish and see my bonus", "Terminar y ver mi bono")}</button>
    </form></div></main>`;
  document.getElementById("deb").addEventListener("submit", async e => {
    e.preventDefault();
    // Existing bonus rule, unchanged: one trip is picked at random and the money kept on that trip is the bonus (never below $0).
    const counted = S.summaries.filter(s => s.type !== "practice"); const pickT = counted[hashStr(S.cfg.pid + "bonus") % counted.length];
    S.debrief = { realism: Number(document.querySelector('input[name="real"]:checked').value), ignored: [...document.querySelectorAll('input[name="ign"]:checked')].map(x => x.value).join("; "), purpose: document.getElementById("purpose").value, bonus_trip: pickT.no + 1, bonus: Math.max(0, pickT.kept) };
    const bonus = money(Math.max(0, pickT.kept));
    app.innerHTML = `<main class="center gutter"><div class="inner"><div class="boxcard">
      <span class="eyebrow">${L("Thank you", "Gracias")}</span><h1 style="font-size:28px">${L("Your bonus", "Tu bono")}: ${bonus}</h1>
      <p class="muted">${L(`Trip ${pickT.no + 1} was picked at random. You kept ${bonus} of that week's money, so that is your bonus.`, `Se eligió la compra ${pickT.no + 1} al azar. Te quedaste con ${bonus} del dinero de esa semana, así que ese es tu bono.`)}</p>
      ${demo ? `<p class="note">${L("Demo only. In the study, the bonus is paid with the regular incentive.", "Solo demo. En el estudio, el bono se paga con el incentivo habitual.")}</p><div><button type="button" class="btn" id="next">Open the researcher view</button></div>` : `<p class="note" id="send-status">${L("Saving your answers…", "Guardando tus respuestas…")}</p><div id="send-next"></div>`}</div></div></main>`;
    if (demo) { document.getElementById("next").addEventListener("click", next); return; }
    store("choicelab_done_" + S.cfg.pid, "1");
    const st = await sendRecord("complete");
    const msg = document.getElementById("send-status"); const nx = document.getElementById("send-next");
    msg.textContent = st === "no_endpoint" ? "Study data endpoint is not configured yet (CONFIG.dataEndpoint), so nothing was saved. Study ID: " + S.cfg.pid : st === "failed" ? L("We couldn't save your answers. Please tell the study team your ID: ", "No pudimos guardar tus respuestas. Dale tu ID al equipo del estudio: ") + S.cfg.pid : L("Your answers are saved. You can close this page.", "Tus respuestas se guardaron. Puedes cerrar esta página.");
    if (CONFIG.returnUrl) nx.innerHTML = `<a class="btn" href="${esc(fillUrl(CONFIG.returnUrl, "complete", Math.max(0, pickT.kept)))}">${L("Continue", "Continuar")}</a>`;
  });
}

/* ===================== Researcher results (demo only) ===================== */
function toCSV(rows) { const cols = [...new Set(rows.flatMap(r => Object.keys(r)))]; return [cols.join(","), ...rows.map(r => cols.map(c => `"${String(r[c] == null ? "" : r[c]).replace(/"/g, '""')}"`).join(","))].join("\n"); }
const otherText = s => s.other ? [s.o.sources.map(k => (OTHER_SRC.find(x => x[0] === k) || [k, k])[1]).join(", "), s.o.text, s.o.amount !== "" ? money(s.o.amount) : ""].filter(Boolean).join(" · ") : "—";
function renderEnd() {
  document.body.classList.remove("online-mode");
  if (MODE !== "demo") return;
  const P = S.profile; const sums = S.summaries; const maxSpend = Math.max(1, ...sums.map(s => s.spent));
  const label = s => s.type === "baseline" ? "Baseline (current market)" : POLICIES[s.policy].label;
  const cells = s => `<td class="num">${s.units.ends}</td><td class="num">${s.units.device}</td><td class="num">${s.units.cig}</td><td class="num">${s.units.cigar}</td><td class="num">${s.units.pouch}</td><td class="num">${s.units.nrt}</td><td class="num">${s.noPurchase ? "Yes" : "No"}</td><td class="num">${s.mg}</td>`;
  const tRows = sums.map(s => `<tr><td class="num">${s.no + 1}</td><td>${esc(label(s))}</td><td class="num">×${s.mult.toFixed(1)}</td>${cells(s)}<td><span class="spendbar" style="width:${Math.round((s.spent / maxSpend) * 70)}px"></span><span class="mono">${money(s.spent)}</span></td><td class="num">${money(s.spend.ends + s.spend.device)}</td><td class="num">${s.own ? money(s.own) : "—"}</td><td class="other-cell">${esc(otherText(s))}</td><td class="num">${money(s.kept)}</td><td class="num">${s.secs}s</td></tr>`).join("");
  const PR = participantRow(); const d = k => { const v = PR["d_" + k]; return v === "" ? "—" : (Number(v) > 0 ? "+" : "") + v; };
  const dRow = sums.length === 2 ? `<tr class="delta"><td></td><td><b>Change (policy − baseline)</b></td><td></td><td class="num">${d("units_ends")}</td><td class="num">${d("units_device")}</td><td class="num">${d("units_cig")}</td><td class="num">${d("units_cigar")}</td><td class="num">${d("units_pouch")}</td><td class="num">${d("units_nrt")}</td><td class="num">${d("no_purchase")}</td><td class="num">${d("nic_mg_bought")}</td><td class="mono">${d("spend_total")}</td><td class="num">${(() => { const v = round2(sums[1].spend.ends + sums[1].spend.device - sums[0].spend.ends - sums[0].spend.device); return (v > 0 ? "+" : "") + v.toFixed(2); })()}</td><td class="num">${d("own_money_added")}</td><td class="num">${d("other_source")}</td><td class="num">${d("money_kept")}</td><td></td></tr>` : "";
  const flags = [
    ["Saw only baseline + assigned policy (" + S.cfg.policy + ")", !PR.only_assigned_policy_shown],
    ["Baseline store identical to the standard baseline (same for all groups)", PR.baseline_matches_standard !== 1],
    ["Budget the same on both trips (" + money(S.budget) + ")", false],
    ["Same basket on both trips", sums.length > 1 && new Set(sums.map(s => s.basket)).size === 1],
    ["Any trip under 8 seconds", sums.some(s => s.secs < 8)],
    ["Budget ran out on " + sums.filter(s => s.capped).length + " trip(s)", sums.some(s => s.capped)],
    ["Eligible for the exclusive-ENDS sample" + (P.ineligible_reasons ? " (" + P.ineligible_reasons + ")" : ""), !P.eligible]
  ];
  const flagHtml = flags.map(([t, bad]) => `<div class="flag"><span class="pill ${bad ? "check" : "ok"}">${bad ? "Check" : "OK"}</span><span>${esc(t)}</span></div>`).join("");
  const attn = S.rows.reduce((a, r) => { a.views += r.times_examined; a.hover += r.hover_ms; a.puts += r.put_backs; return a; }, { views: 0, hover: 0, puts: 0 });
  const D = S.debrief; const E = CONFIG.eligibility;
  app.innerHTML = `<main class="console gutter"><div class="inner">
    <div style="display:grid;gap:8px"><span class="eyebrow">Researcher view · demo data</span><h1 style="font-size:clamp(28px,4vw,40px)">What the study records</h1>
      <p class="lead muted">Session ${esc(S.cfg.pid)}: randomized to <b>Group ${S.cfg.group}, ${esc(POLICIES[S.cfg.policy].label)}</b> (${esc(S.cfg.allocation.replace(/_/g, " "))}); ${S.channel === "online" ? "online store" : "walk-in store"}; ${S.lang === "es" ? "Spanish" : "English"}. These are simulated purchases in a virtual store, not observed real-world tobacco use.</p></div>
    <div class="sec"><h2>Participant profile</h2><dl class="profile-grid">
      <div><dt>Age</dt><dd>${P.age}</dd></div><div><dt>Usual device</dt><dd>${esc(P.usual_device)}</dd></div><div><dt>Usual flavor</dt><dd>${esc(P.usual_flavor)}</dd></div>
      <div><dt>Usual strength</dt><dd>${esc(P.usual_nicotine)}</dd></div><div><dt>Days vaped, past 30</dt><dd>${P.days_vaped_30}</dd></div><div><dt>Weekly spend, all tobacco &amp; nicotine</dt><dd>${money(P.weekly_spend)}</dd></div>
      <div><dt>Store budget (both trips)</dt><dd>${money(P.budget)}</dd></div><div><dt>Usually buys at (store mode)</dt><dd>${esc(P.usual_source)} (${S.channel === "online" ? "online" : "walk-in"})</dd></div><div><dt>Other products, past 30 days</dt><dd>${esc(P.other_products || "None")}</dd></div>
      <div><dt>Eligible</dt><dd>${P.eligible ? "Yes" : "No" + (P.eligibility_override_demo ? " (continued in demo)" : "")}</dd></div>
    </dl><p class="note">Eligibility rule (editable in CONFIG): age ${E.ageMin}–${E.ageMax}, vaped on ≥${E.minVapeDays30} of the past 30 days, no past-30-day use of ${E.exclude.join(", ")}.</p></div>
    <div class="sec"><h2>Simulated purchases</h2><div class="table-wrap"><table><thead><tr><th class="num">Trip</th><th>Condition</th><th class="num">E-cig price</th><th class="num">E-cig units</th><th class="num">Devices</th><th class="num">Cig packs</th><th class="num">Cigarillo packs</th><th class="num">Pouch tins</th><th class="num">Gum</th><th class="num">No purchase</th><th class="num">Nicotine mg</th><th>Spent (with tax)</th><th class="num">E-cig spend</th><th class="num">Own money</th><th>Other source (stated)</th><th class="num">Kept</th><th class="num">Time</th></tr></thead><tbody>${tRows}${dRow}</tbody></table></div>
      <p class="note">Nicotine mg is the approximate nicotine content of products chosen, not the dose delivered. Attention: ${attn.views} product views, ${Math.round(attn.hover / 1000)} s of look time, ${attn.puts} put-backs.</p></div>
    <div class="sec"><h2>Data quality checks</h2><div class="flags">${flagHtml}</div></div>
    <div class="sec"><h2>Debrief and bonus</h2><dl class="profile-grid"><div><dt>Realism (1–5)</dt><dd>${D.realism}</dd></div><div><dt>Features ignored</dt><dd>${esc(D.ignored || "None")}</dd></div><div><dt>Guessed purpose</dt><dd>${esc(D.purpose || "—")}</dd></div><div><dt>Bonus trip</dt><dd>Trip ${D.bonus_trip} · ${money(D.bonus)}</dd></div></dl></div>
    <div class="sec"><h2>Export (demo data)</h2><div class="actions"><button class="btn" type="button" data-csv="participant">Participant row (wide)</button><button class="btn ghost" type="button" data-csv="trip">Trip rows (long)</button><button class="btn ghost" type="button" data-csv="item">Item rows</button><button class="btn ghost" type="button" id="again">Run another session</button><span class="toast" id="toast" aria-live="polite"></span></div>
      <p class="note">Participant row: one line per person with baseline (b_), policy (p_) and change (d_) columns, for comparing groups. Trip rows: two lines per person, for within-person models. Item rows: ${S.rows.length} lines (one per product per trip). Every row carries data_mode = demo.</p>
      <textarea class="csv" id="csv" readonly hidden aria-label="CSV data"></textarea></div>
  </div></main>`;
  const sets = { participant: () => [participantRow()], trip: tripRows, item: () => S.rows };
  app.querySelectorAll("[data-csv]").forEach(btn => btn.addEventListener("click", () => {
    const kind = btn.dataset.csv; const csv = toCSV(sets[kind]()); const ta = document.getElementById("csv"); const toast = document.getElementById("toast");
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `choicelab_${S.cfg.pid}_${kind}.csv`; document.body.appendChild(a); a.click(); a.remove(); } catch (err) {}
    ta.hidden = false; ta.value = csv; toast.textContent = `${kind} CSV downloaded. If it didn't, the data is in the box below.`;
  }));
  document.getElementById("again").addEventListener("click", () => { S.step = 0; S.lang = "en"; renderSetup(); window.scrollTo(0, 0); });
}

renderSetup();
</script>
